<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101c2d"><title>i-Snex · Scan. Order. Enjoy.</title><link rel="stylesheet" href="styles.css"><style>
.display-page{max-width:1500px;margin:auto;padding:34px clamp(22px,4vw,64px) 45px}.display-hero{text-align:center;padding:28px 0 34px}.display-hero .eyebrow{justify-content:center}.display-hero h1{font:900 clamp(48px,7vw,90px)/1 Manrope;letter-spacing:-5px;color:var(--navy);margin:18px 0 10px}.display-hero h1 em{font-style:normal;color:var(--orange)}.display-hero p{color:#828c96;font-size:15px}.display-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:22px}.display-card{background:#fff;border:1px solid #e7e2d9;border-radius:24px;overflow:hidden;box-shadow:var(--shadow);display:flex;flex-direction:column}.display-band{height:165px;background:var(--card-accent);display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}.display-band:before,.display-band:after{content:'';position:absolute;width:230px;height:230px;border:1px solid #ffffff66;border-radius:50%}.display-band:after{width:165px;height:165px}.display-band span{font-size:88px;z-index:1;filter:drop-shadow(0 12px 10px #17233322)}.display-info{padding:22px 24px;display:flex;align-items:center;justify-content:space-between;gap:15px}.display-info h2{font:900 22px Manrope;letter-spacing:-.8px;margin:0 0 5px}.display-info p{font-size:11px;color:#929aa1;margin:0}.display-qr{width:128px;height:128px;padding:8px;border:1px solid #eee9e0;border-radius:14px;background:#fff;flex-shrink:0}.display-qr img{width:100%;height:100%;display:block}.display-cta{text-align:center;background:var(--navy);color:#fff;border-radius:12px;padding:13px;margin:0 22px 22px;font-size:12px;font-weight:900;letter-spacing:.3px}.display-footer{text-align:center;color:#9ba2a8;font-size:10px;letter-spacing:2px;font-weight:900;margin-top:28px}.display-footer b{color:var(--orange)}@media(max-width:850px){.display-grid{grid-template-columns:1fr;max-width:650px;margin:auto}.display-card{display:grid;grid-template-columns:35% 1fr;grid-template-rows:1fr auto}.display-band{height:100%;min-height:180px;grid-row:1/3}.display-info{padding:18px 18px 8px}.display-info h2{font-size:18px}.display-qr{width:94px;height:94px}.display-cta{margin:5px 18px 17px}.display-hero h1{letter-spacing:-3px}}@media(max-width:500px){.display-info{align-items:flex-start;flex-direction:column}.display-qr{width:78px;height:78px}.display-band span{font-size:60px}.display-card{grid-template-columns:30% 1fr}}
</style></head><body><header class="topbar"><a class="brand" href="index.html"><span class="brand-symbol">i<span>·</span></span><span class="brand-name">i-Snex<small>IPEX FOOD CLUB</small></span></a><div class="top-actions"><span class="connection-pill"><i style="background:#43a876"></i><span>Scan. Order. Enjoy.</span></span></div></header><main class="display-page"><section class="display-hero"><div class="eyebrow"><span class="eyebrow-dot"></span> IPEX LUNCH CLUB <span class="eyebrow-line"></span></div><h1>Good food.<br><em>Good mood.</em></h1><p>Scan de QR-code van jouw favoriet en plaats je bestelling.</p></section><section class="display-grid" id="display-grid"></section><div class="display-footer">THREE SPOTS. ONE HAPPY LUNCH. <b>✳</b></div></main><script>
const places=[{id:'specht',name:'Cafetaria De Specht',town:'Goor',emoji:'🍟',color:'#f5c17d'},{id:'bie',name:'Bie Immink',town:'Enter',emoji:'🥪',color:'#bfd6ad'},{id:'kebab',name:'Kebab van Erhan',town:'Enter',emoji:'🥙',color:'#edb49a'}];const root=document.getElementById('display-grid');root.innerHTML=places.map((p,i)=>{const url=new URL('index.html?restaurant='+p.id,location.href).href;const qr='https://api.qrserver.com/v1/create-qr-code/?size=260x260&margin=5&data='+encodeURIComponent(url);return `<article class="display-card"><div class="display-band" style="--card-accent:${p.color}"><span>${p.emoji}</span></div><div class="display-info"><div><h2>${p.name}</h2><p>${p.town} · IPEX FOOD CLUB</p></div><div class="display-qr"><img src="${qr}" alt="QR-code voor ${p.name}"></div></div><div class="display-cta">SCAN TO ORDER&nbsp; ↗</div></article>`}).join('');
</script></body></html>
